<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap-reboot.min.css" rel="stylesheet">
	<style>
	.myDiv {
		border: 5px outset red;
		background-color: lightblue;    
		text-align: center;
	}
	</style>
</head>
<body>
    <div id="app"></div>
    <script type="text/babel">
		// import IntlMessageFormat from 'intl-messageformat';
	const customTranslation = "Hi {name}, you have {numProducts, plural, =0 {no items} one {1 item} other {# items}} in your cart.";
		
      function Application() {
		  const [name, setName] = React.useState('Alex');
		  const [numProducts, setNumProducts] = React.useState(3);
		
		  // useMemo ensures formatting runs only when dependencies change
		  const formattedMessage = React.useMemo(() => {
		    const formatter = new IntlMessageFormat(customTranslation, 'en');
		    return formatter.format({ name, numProducts });
		  }, [name, numProducts]); 
		
		  return (
		    <div>
		      <p>{formattedMessage}</p>
		      <input value={name} onChange={(e) => setName(e.target.value)} />
		      <input type="number" value={numProducts} onChange={(e) => setNumProducts(Number(e.target.value))} />
		    </div>
		  );
      }
		ReactDOM.createRoot(document.getElementById('app')).render(<Application/>);
    </script>
    <script src="https://unpkg.com/react@latest/umd/react.development.js"></script>
    <!-- https://unpkg.com/react@18.2.0/umd/react.production.min.js -->
    <script src="https://unpkg.com/react-dom@latest/umd/react-dom.development.js"></script>
    <!-- https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js -->
    <script src="https://unpkg.com/babel-standalone@latest/babel.min.js"></script>
</body>
</html>
